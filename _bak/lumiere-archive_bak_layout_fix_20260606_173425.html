<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumière Archive</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #ececec;
      background-image:
        linear-gradient(rgba(170,170,170,0.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(170,170,170,0.22) 1px, transparent 1px);
      background-size: 44px 44px;
      font-family: 'Courier Prime', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 32px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #1a1a1a;
    }

    /* ── CAROUSEL ── */
    #carousel {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 500px;
    }

    .card {
      position: absolute;
      background-size: cover;
      background-position: center;
      filter: grayscale(100%);
      border-radius: 1px;
    }

    /* ── FOOTER ── */
    footer {
      padding: 52px 0 44px;
      text-align: center;
    }

    .footer-row {
      display: inline-flex;
      align-items: baseline;
      border-bottom: 1px solid #666;
      padding-bottom: 8px;
    }

    .f-label {
      font-family: 'Courier Prime', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #333;
      margin-right: 24px;
    }

    .f-input {
      font-family: 'Courier Prime', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #333;
      background: transparent;
      border: none;
      outline: none;
      width: 220px;
    }

    .f-input::placeholder {
      color: #aaa;
    }

    .f-btn {
      font-family: 'Courier Prime', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #1a1a1a;
      background: none;
      border: none;
      cursor: pointer;
      margin-left: 20px;
      padding: 0;
    }

    .f-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <span>Lumière Archive</span>
    <span>Issue 01 / Curated Selection</span>
  </header>

  <div id="carousel"></div>

  <footer>
    <div class="footer-row">
      <span class="f-label">Request Access</span>
      <input class="f-input" type="email" placeholder="your@email.com" />
      <button class="f-btn">Join</button>
    </div>
  </footer>

  <script>
  (function () {
    const SPEED   = 40;   /* px / sec */
    const SPACING = 310;  /* center-to-center px */

    const IMGS = [
      'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600',
      'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=600',
      'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600',
      'https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?w=600',
    ];
    const FALL = ['#d0d0d0', '#9aab98', '#c8bfb0', '#b8c0b8'];

    /*
     * Visual states at integer dist:
     *   S[0] = dist -2  (far-left,  partially cut off)
     *   S[1] = dist -1  (left)
     *   S[2] = dist  0  (center, anchor)
     *   S[3] = dist +1  (right)
     *   S[4] = dist +2  (far-right, partially cut off)
     */
    const S = [
      { w: 190, h: 340, op: 0.50, rot: -3, sh: 'none' },
      { w: 265, h: 390, op: 1.00, rot:  0, sh: '0 4px 18px rgba(0,0,0,0.18)' },
      { w: 295, h: 410, op: 1.00, rot:  0, sh: '0 8px 36px rgba(0,0,0,0.30)' },
      { w: 250, h: 375, op: 0.85, rot:  0, sh: '0 2px 10px rgba(0,0,0,0.12)' },
      { w: 220, h: 350, op: 0.55, rot:  0, sh: 'none' },
    ];

    function lerp(a, b, t) { return a + (b - a) * t; }

    function styleAt(dist) {
      /* clamp dist to [-2, 2] range, map to array index [0, 4] */
      const idx = Math.max(0, Math.min(4, dist + 2));
      const lo  = Math.min(3, Math.floor(idx));
      const hi  = lo + 1;
      const t   = idx - lo;
      if (t === 0 || hi > 4) return S[lo];
      return {
        w:   lerp(S[lo].w,   S[hi].w,   t),
        h:   lerp(S[lo].h,   S[hi].h,   t),
        op:  lerp(S[lo].op,  S[hi].op,  t),
        rot: lerp(S[lo].rot, S[hi].rot, t),
        sh:  t < 0.5 ? S[lo].sh : S[hi].sh,
      };
    }

    const wrap = document.getElementById('carousel');

    /* Center anchor: center card left edge at 36vw, so card center at 36vw + 147px */
    function getAnchor() { return window.innerWidth * 0.36 + 147; }

    /* Enough cards to fill the viewport and wrap seamlessly */
    const NUM = Math.max(8, Math.ceil(window.innerWidth / SPACING) + 4);

    const cards = [];
    for (let i = 0; i < NUM; i++) {
      const el = document.createElement('div');
      el.className = 'card';
      const ii = i % IMGS.length;
      el.style.backgroundImage = `url('${IMGS[ii]}')`;
      el.style.backgroundColor = FALL[ii];
      wrap.appendChild(el);
      /* position 0 = center, -1 = left, -2 = far-left, etc. */
      cards.push({ el, cx: getAnchor() + (i - 2) * SPACING });
    }

    let last = null;

    function tick(ts) {
      if (!last) last = ts;
      const dt = Math.min((ts - last) / 1000, 0.05); /* cap at 50ms to avoid jumps */
      last = ts;

      const anch = getAnchor();
      const ch   = wrap.offsetHeight;

      /* 1 — move all cards left */
      for (const c of cards) c.cx -= SPEED * dt;

      /* 2 — wrap off-screen-left cards to the far right */
      /*     sort ascending so leftmost wraps first; each wrap uses updated max */
      cards.sort((a, b) => a.cx - b.cx);
      for (const c of cards) {
        if (c.cx + 148 < 0) { /* 148 ≈ half of widest card (295/2) + small buffer */
          const maxCx = Math.max(...cards.map(x => x.cx));
          c.cx = maxCx + SPACING;
        }
      }

      /* 3 — render */
      for (const c of cards) {
        const dist = (c.cx - anch) / SPACING;

        if (Math.abs(dist) > 3.2) {
          c.el.style.display = 'none';
          continue;
        }

        const s    = styleAt(dist);
        const left = c.cx - s.w / 2;
        const top  = (ch - s.h) / 2;
        /* center card sits on top; outer cards recede */
        const zi   = Math.round(10 - Math.abs(dist) * 3);

        c.el.style.display   = 'block';
        c.el.style.left      = left.toFixed(1) + 'px';
        c.el.style.top       = top.toFixed(1)  + 'px';
        c.el.style.width     = s.w.toFixed(1)  + 'px';
        c.el.style.height    = s.h.toFixed(1)  + 'px';
        c.el.style.opacity   = s.op.toFixed(3);
        c.el.style.boxShadow = s.sh;
        c.el.style.transform = s.rot ? `rotate(${s.rot.toFixed(2)}deg)` : 'none';
        c.el.style.zIndex    = zi;
      }

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  }());
  </script>
</body>
</html>
